<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Localização</title>
  <style>
    :root {
      --green-950: #052e16;
      --green-800: #166534;
      --green-700: #15803d;
      --green-600: #16a34a;
      --green-500: #22c55e;
      --green-100: #dcfce7;
      --green-50: #f0fdf4;
      --white: #ffffff;
      --slate-700: #334155;
      --slate-500: #64748b;
      --border: #bbf7d0;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --error-border: #fecaca;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow: 0 20px 45px -15px rgba(21, 128, 61, 0.18), 0 4px 12px rgba(5, 46, 22, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(160deg, var(--green-50) 0%, var(--white) 55%, var(--green-100) 100%);
      color: var(--green-950);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--green-800), var(--green-600));
      color: var(--white);
      padding: 28px 28px 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.16);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.88);
    }

    .card-body {
      padding: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--green-950);
      margin-bottom: 6px;
    }

    .input-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--green-950);
      background: var(--white);
      border: 1.5px solid #d1d5db;
      border-radius: var(--radius-md);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .input-control::placeholder {
      color: #94a3b8;
    }

    .input-control:focus {
      outline: none;
      border-color: var(--green-600);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
      background: var(--white);
    }

    .input-control.is-invalid {
      border-color: var(--error-text);
      background: var(--error-bg);
    }

    .input-control.is-invalid:focus {
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.14);
    }

    .hint {
      display: block;
      font-size: 0.78rem;
      color: var(--slate-500);
      margin-top: 5px;
    }

    .field-error {
      display: none;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--error-text);
      margin-top: 5px;
    }

    .field-error.visible {
      display: block;
    }

    .gps-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--green-800);
      background: var(--green-50);
      border: 1.5px dashed var(--green-500);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .gps-btn:hover:not(:disabled) {
      background: var(--green-100);
      border-color: var(--green-700);
    }

    .gps-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .gps-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .submit-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
      background: var(--green-700);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(21, 128, 61, 0.25);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--green-800);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .status-banner.visible {
      display: flex;
    }

    .status-banner.success {
      background: var(--green-50);
      color: var(--green-800);
      border: 1px solid var(--border);
    }

    .status-banner.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .is-loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .card-header,
      .card-body {
        padding: 22px 18px;
      }

      .coords-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        Geolocalização
      </div>
      <h1>Cadastro de Local</h1>
      <p>Informe o nome do local e as coordenadas decimais separadas por ponto.</p>
    </header>

    <section class="card-body">
      <div id="statusBanner" class="status-banner" role="status" aria-live="polite"></div>

      <form id="locationForm" novalidate>
        <div class="form-group">
          <label for="local">Local</label>
          <input
            id="local"
            name="entry.696170020"
            type="text"
            class="input-control"
            placeholder="Ex.: Parque Taquaral"
            autocomplete="off"
            required
          />
          <span id="localError" class="field-error">Informe o nome ou a descrição do local.</span>
        </div>

        <button type="button" id="gpsBtn" class="gps-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4" />
          </svg>
          <span id="gpsBtnText">Preencher com minha localização atual</span>
        </button>

        <div class="coords-grid">
          <div class="form-group">
            <label for="latitude">Latitude</label>
            <input
              id="latitude"
              name="entry.1887288141"
              type="text"
              inputmode="decimal"
              class="input-control"
              placeholder="-23.027000"
              autocomplete="off"
              required
            />
            <span class="hint">Entre -90 e 90 (ex.: -23.027000)</span>
            <span id="latitudeError" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="longitude">Longitude</label>
            <input
              id="longitude"
              name="entry.1670270912"
              type="text"
              inputmode="decimal"
              class="input-control"
              placeholder="-47.060800"
              autocomplete="off"
              required
            />
            <span class="hint">Entre -180 e 180 (ex.: -47.060800)</span>
            <span id="longitudeError" class="field-error"></span>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitBtnText">Enviar dados</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const GOOGLE_FORM_ACTION =
        'https://docs.google.com/forms/d/e/1FAIpQLSdZwLqHshTRbl1pyjxTPa0rW4NKC58YCyR1fIDq8sGcmUMgyw/formResponse';

      const FIELD_IDS = {
        local: 'entry.696170020',
        latitude: 'entry.1887288141',
        longitude: 'entry.1670270912',
      };

      // Exige sinal negativo opcional + parte inteira + ponto + parte decimal (ex.: -23.027000)
      const COORD_REGEX = /^-?\d+\.\d+$/;

      const form = document.getElementById('locationForm');
      const localInput = document.getElementById('local');
      const latInput = document.getElementById('latitude');
      const lngInput = document.getElementById('longitude');
      const gpsBtn = document.getElementById('gpsBtn');
      const gpsBtnText = document.getElementById('gpsBtnText');
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');
      const statusBanner = document.getElementById('statusBanner');

      function showStatus(type, message) {
        statusBanner.className = `status-banner visible ${type}`;
        statusBanner.textContent = message;
      }

      function clearStatus() {
        statusBanner.className = 'status-banner';
        statusBanner.textContent = '';
      }

      function setFieldError(input, errorElId, message) {
        const errorEl = document.getElementById(errorElId);
        if (message) {
          input.classList.add('is-invalid');
          errorEl.textContent = message;
          errorEl.classList.add('visible');
          return false;
        }
        input.classList.remove('is-invalid');
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
        return true;
      }

      // Mantém apenas dígitos, sinal negativo no início e um único ponto decimal
      function sanitizeCoordinate(rawValue) {
        let cleaned = rawValue.replace(/,/g, '.').replace(/[^0-9.-]/g, '');
        const isNegative = cleaned.startsWith('-');
        cleaned = cleaned.replace(/-/g, '');

        const parts = cleaned.split('.');
        if (parts.length > 2) {
          cleaned = `${parts[0]}.${parts.slice(1).join('')}`;
        }

        return (isNegative ? '-' : '') + cleaned;
      }

      function validateCoordinate(input, errorElId, min, max, label) {
        const value = input.value.trim();

        if (!value) {
          return setFieldError(input, errorElId, `Informe a ${label}.`);
        }

        if (!COORD_REGEX.test(value)) {
          return setFieldError(
            input,
            errorElId,
            'Use apenas parte inteira e decimal separadas por ponto (ex.: -23.027000).'
          );
        }

        const numericValue = Number(value);
        if (!Number.isFinite(numericValue) || numericValue < min || numericValue > max) {
          return setFieldError(
            input,
            errorElId,
            `A ${label} deve estar entre ${min} e ${max}.`
          );
        }

        return setFieldError(input, errorElId, '');
      }

      function validateLocal() {
        const valid = localInput.value.trim().length > 0;
        return setFieldError(
          localInput,
          'localError',
          valid ? '' : 'Informe o nome ou a descrição do local.'
        );
      }

      [latInput, lngInput].forEach((input) => {
        input.addEventListener('input', (event) => {
          const sanitized = sanitizeCoordinate(event.target.value);
          if (event.target.value !== sanitized) {
            event.target.value = sanitized;
          }
          clearStatus();
        });
      });

      localInput.addEventListener('blur', validateLocal);
      latInput.addEventListener('blur', () =>
        validateCoordinate(latInput, 'latitudeError', -90, 90, 'latitude')
      );
      lngInput.addEventListener('blur', () =>
        validateCoordinate(lngInput, 'longitudeError', -180, 180, 'longitude')
      );

      gpsBtn.addEventListener('click', () => {
        clearStatus();

        if (!('geolocation' in navigator)) {
          showStatus('error', 'Seu navegador não suporta captura de geolocalização.');
          return;
        }

        gpsBtn.disabled = true;
        gpsBtnText.textContent = 'Obtendo coordenadas...';

        navigator.geolocation.getCurrentPosition(
          (position) => {
            latInput.value = position.coords.latitude.toFixed(6);
            lngInput.value = position.coords.longitude.toFixed(6);
            validateCoordinate(latInput, 'latitudeError', -90, 90, 'latitude');
            validateCoordinate(lngInput, 'longitudeError', -180, 180, 'longitude');
            gpsBtn.disabled = false;
            gpsBtnText.textContent = 'Preencher com minha localização atual';
          },
          (err) => {
            const messages = {
              1: 'Permissão de localização negada. Digite as coordenadas manualmente.',
              2: 'Não foi possível determinar sua localização atual.',
              3: 'Tempo esgotado ao buscar o GPS. Tente novamente.',
            };
            showStatus('error', messages[err.code] || 'Erro ao obter localização.');
            gpsBtn.disabled = false;
            gpsBtnText.textContent = 'Preencher com minha localização atual';
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearStatus();

        const isLocalValid = validateLocal();
        const isLatValid = validateCoordinate(latInput, 'latitudeError', -90, 90, 'latitude');
        const isLngValid = validateCoordinate(lngInput, 'longitudeError', -180, 180, 'longitude');

        if (!isLocalValid || !isLatValid || !isLngValid) {
          showStatus('error', 'Revise os campos destacados antes de enviar.');
          return;
        }

        const payload = new URLSearchParams();
        payload.append(FIELD_IDS.local, localInput.value.trim());
        payload.append(FIELD_IDS.latitude, latInput.value.trim());
        payload.append(FIELD_IDS.longitude, lngInput.value.trim());

        submitBtn.disabled = true;
        submitBtn.classList.add('is-loading');
        submitBtnText.textContent = 'Enviando...';

        try {
          await fetch(GOOGLE_FORM_ACTION, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
            },
            body: payload.toString(),
          });

          form.reset();
          showStatus('success', 'Registro enviado com sucesso para a planilha do Google Forms.');
        } catch (error) {
          showStatus('error', 'Falha de rede ao enviar os dados. Verifique sua conexão e tente novamente.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.classList.remove('is-loading');
          submitBtnText.textContent = 'Enviar dados';
        }
      });
    })();
  </script>
</body>
</html>
