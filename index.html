<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Localização</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f172a;
      --secondary-hover: #1e293b;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-gps {
      background-color: var(--secondary);
      color: #fff;
    }

    .btn-gps:hover:not(:disabled) {
      background-color: var(--secondary-hover);
    }

    .btn-submit {
      background-color: var(--primary);
      color: #fff;
      margin-top: 0.25rem;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .status {
      display: none;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      border: 1px solid transparent;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .status.error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .status.info {
      background: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      .coords-grid {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Registrar Coordenadas</h1>
      <p class="subtitle">Preencha o local e capture ou informe a latitude e longitude.</p>
    </header>

    <form id="locationForm" novalidate>
      <div class="field">
        <label for="local">Local</label>
        <input
          type="text"
          id="local"
          name="local"
          placeholder="Ex.: Parque Taquaral - Portão 1"
          autocomplete="off"
          required
        />
      </div>

      <button type="button" id="btnGps" class="btn btn-gps">
        Capturar localização atual (GPS)
      </button>

      <div class="coords-grid">
        <div class="field">
          <label for="latitude">Latitude</label>
          <input
            type="text"
            id="latitude"
            name="latitude"
            inputmode="decimal"
            placeholder="-23.027000"
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <label for="longitude">Longitude</label>
          <input
            type="text"
            id="longitude"
            name="longitude"
            inputmode="decimal"
            placeholder="-47.060830"
            autocomplete="off"
            required
          />
        </div>
      </div>

      <p class="hint">Formato decimal com ponto (ex.: -23.027000). Vírgulas são convertidas automaticamente.</p>

      <div id="statusBox" class="status" role="status" aria-live="polite"></div>

      <button type="submit" id="btnSubmit" class="btn btn-submit">
        Enviar registro
      </button>
    </form>
  </main>

  <script>
    (() => {
      const FORM_ACTION =
        "https://docs.google.com/forms/d/e/1FAIpQLSdZwLqHshTRbl1pyjxTPa0rW4NKC58YCyR1fIDq8sGcmUMgyw/formResponse";

      const ENTRY_IDS = {
        local: "entry.696170020",
        latitude: "entry.1887288141",
        longitude: "entry.1670270912",
      };

      const DECIMAL_PLACES = 6;
      const STRICT_DECIMAL_REGEX = /^-?\d+\.\d+$/;

      const form = document.getElementById("locationForm");
      const localInput = document.getElementById("local");
      const latInput = document.getElementById("latitude");
      const lngInput = document.getElementById("longitude");
      const btnGps = document.getElementById("btnGps");
      const btnSubmit = document.getElementById("btnSubmit");
      const statusBox = document.getElementById("statusBox");

      function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = `status show ${type}`;
      }

      function clearStatus() {
        statusBox.textContent = "";
        statusBox.className = "status";
      }

      // Remove caracteres inválidos em tempo real e converte vírgula em ponto
      function sanitizeCoordinateInput(raw) {
        let cleaned = raw.replace(/,/g, ".").replace(/[^0-9.-]/g, "");

        // Mantém o sinal negativo apenas na primeira posição
        const isNegative = cleaned.startsWith("-");
        cleaned = cleaned.replace(/-/g, "");
        if (isNegative) cleaned = "-" + cleaned;

        // Mantém apenas o primeiro ponto decimal
        const parts = cleaned.split(".");
        if (parts.length > 2) {
          cleaned = parts[0] + "." + parts.slice(1).join("");
        }

        return cleaned;
      }

      // Valida intervalo geográfico e padroniza para parte inteira + decimal com ponto
      function parseAndFormatCoordinate(raw, min, max) {
        const sanitized = sanitizeCoordinateInput(raw.trim());
        if (!sanitized || sanitized === "-" || sanitized === "." || sanitized === "-.") {
          return null;
        }

        const numeric = Number(sanitized);
        if (!Number.isFinite(numeric) || numeric < min || numeric > max) {
          return null;
        }

        const formatted = numeric.toFixed(DECIMAL_PLACES);
        return STRICT_DECIMAL_REGEX.test(formatted) ? formatted : null;
      }

      function bindCoordinateField(input, min, max) {
        input.addEventListener("input", () => {
          const cursorPos = input.selectionStart;
          const sanitized = sanitizeCoordinateInput(input.value);
          if (input.value !== sanitized) {
            input.value = sanitized;
            input.setSelectionRange(cursorPos, cursorPos);
          }
          input.classList.remove("invalid");
        });

        input.addEventListener("blur", () => {
          if (!input.value.trim()) return;
          const formatted = parseAndFormatCoordinate(input.value, min, max);
          if (formatted) {
            input.value = formatted;
            input.classList.remove("invalid");
          } else {
            input.classList.add("invalid");
          }
        });
      }

      bindCoordinateField(latInput, -90, 90);
      bindCoordinateField(lngInput, -180, 180);

      btnGps.addEventListener("click", () => {
        clearStatus();

        if (!("geolocation" in navigator)) {
          showStatus("Seu navegador não suporta geolocalização.", "error");
          return;
        }

        const originalLabel = btnGps.textContent;
        btnGps.disabled = true;
        btnGps.innerHTML = '<span class="spinner" aria-hidden="true"></span> Obtendo GPS...';

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(DECIMAL_PLACES);
            const lng = position.coords.longitude.toFixed(DECIMAL_PLACES);
            const accuracy = Math.round(position.coords.accuracy);

            latInput.value = lat;
            lngInput.value = lng;
            latInput.classList.remove("invalid");
            lngInput.classList.remove("invalid");

            showStatus(`Coordenadas capturadas (precisão aproximada: ±${accuracy} m).`, "info");
            btnGps.disabled = false;
            btnGps.textContent = originalLabel;
          },
          (error) => {
            const messages = {
              1: "Permissão de localização negada. Libere o acesso ou digite manualmente.",
              2: "Sinal de localização indisponível no momento.",
              3: "Tempo esgotado ao buscar o GPS. Tente novamente.",
            };
            showStatus(messages[error.code] || "Não foi possível obter a localização.", "error");
            btnGps.disabled = false;
            btnGps.textContent = originalLabel;
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
          }
        );
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();

        const local = localInput.value.trim();
        const formattedLat = parseAndFormatCoordinate(latInput.value, -90, 90);
        const formattedLng = parseAndFormatCoordinate(lngInput.value, -180, 180);

        localInput.classList.toggle("invalid", !local);
        latInput.classList.toggle("invalid", !formattedLat);
        lngInput.classList.toggle("invalid", !formattedLng);

        if (!local) {
          showStatus("Informe o nome ou descrição do local.", "error");
          localInput.focus();
          return;
        }

        if (!formattedLat) {
          showStatus("Latitude inválida. Use um valor entre -90 e 90 (ex.: -23.027000).", "error");
          latInput.focus();
          return;
        }

        if (!formattedLng) {
          showStatus("Longitude inválida. Use um valor entre -180 e 180 (ex.: -47.060830).", "error");
          lngInput.focus();
          return;
        }

        // Garante que os inputs exibam o valor exato que será transmitido
        latInput.value = formattedLat;
        lngInput.value = formattedLng;

        const payload = new URLSearchParams();
        payload.append(ENTRY_IDS.local, local);
        payload.append(ENTRY_IDS.latitude, formattedLat);
        payload.append(ENTRY_IDS.longitude, formattedLng);

        const originalLabel = btnSubmit.textContent;
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner" aria-hidden="true"></span> Enviando...';

        try {
          await fetch(FORM_ACTION, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            },
            body: payload.toString(),
          });

          showStatus(
            `Registro enviado: "${local}" (${formattedLat}, ${formattedLng}).`,
            "success"
          );
          form.reset();
        } catch (err) {
          showStatus("Falha de conexão ao enviar. Verifique sua internet e tente novamente.", "error");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = originalLabel;
        }
      });
    })();
  </script>
</body>
</html>
