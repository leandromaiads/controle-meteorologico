<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Localização</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 460px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .btn {
      width: 100%;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-gps {
      background-color: transparent;
      color: var(--primary);
      border: 1px dashed var(--primary);
      margin-bottom: 1.25rem;
      font-weight: 500;
    }

    .btn-gps:hover:not(:disabled) {
      background-color: rgba(59, 130, 246, 0.1);
    }

    .btn-submit {
      background-color: var(--primary);
      color: #ffffff;
      margin-top: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .status-banner {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      display: none;
    }

    .status-banner.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .status-banner.error {
      display: block;
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    @media (max-width: 420px) {
      .coords-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="header">
      <h1>Registro de Coordenadas</h1>
      <p>Informe o local ou capture sua posição via GPS.</p>
    </div>

    <form id="geoForm">
      <div class="form-group">
        <label for="local">Identificação do Local *</label>
        <input 
          type="text" 
          id="local" 
          name="entry.696170020" 
          placeholder="Ex: Ponto de Coleta A" 
          required 
          autocomplete="off"
        />
      </div>

      <button type="button" id="btnGps" class="btn btn-gps">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
          <circle cx="12" cy="12" r="7"></circle>
        </svg>
        <span id="gpsText">Capturar Latitude e Longitude via GPS</span>
      </button>

      <div class="coords-grid">
        <div class="form-group">
          <label for="latitude">Latitude *</label>
          <input 
            type="text" 
            id="latitude" 
            name="entry.1887288141" 
            placeholder="-22.9064" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="longitude">Longitude *</label>
          <input 
            type="text" 
            id="longitude" 
            name="entry.1670270912" 
            placeholder="-47.0616" 
            required 
          />
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-submit">
        Enviar Registro
      </button>

      <div id="statusBanner" class="status-banner" role="alert"></div>
    </form>
  </main>

  <script>
    // Endpoint de submissão direta do Google Forms (substituindo /viewform por /formResponse)
    const GOOGLE_FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSdZwLqHshTRbl1pyjxTPa0rW4NKC58YCyR1fIDq8sGcmUMgyw/formResponse";

    const form = document.getElementById("geoForm");
    const btnGps = document.getElementById("btnGps");
    const gpsText = document.getElementById("gpsText");
    const btnSubmit = document.getElementById("btnSubmit");
    const statusBanner = document.getElementById("statusBanner");
    const latInput = document.getElementById("latitude");
    const lngInput = document.getElementById("longitude");

    function showStatus(message, type) {
      statusBanner.textContent = message;
      statusBanner.className = `status-banner ${type}`;
    }

    // Captura de coordenadas via API nativa do navegador
    btnGps.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showStatus("Geolocalização não é suportada pelo seu navegador.", "error");
        return;
      }

      btnGps.disabled = true;
      gpsText.textContent = "Obtendo sinal GPS...";
      statusBanner.className = "status-banner";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          latInput.value = position.coords.latitude.toFixed(6);
          lngInput.value = position.coords.longitude.toFixed(6);
          btnGps.disabled = false;
          gpsText.textContent = "Coordenadas atualizadas via GPS";
        },
        (error) => {
          btnGps.disabled = false;
          gpsText.textContent = "Capturar Latitude e Longitude via GPS";

          const errorMessages = {
            1: "Permissão de localização negada no navegador.",
            2: "Sinal de GPS indisponível no momento.",
            3: "Tempo esgotado ao buscar localização."
          };
          showStatus(errorMessages[error.code] || "Erro ao capturar coordenadas.", "error");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });

    // Envio assíncrono para o Google Forms
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Enviando...";
      statusBanner.className = "status-banner";

      const formData = new FormData(form);

      try {
        await fetch(GOOGLE_FORM_ACTION, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        form.reset();
        gpsText.textContent = "Capturar Latitude e Longitude via GPS";
        showStatus("Dados registrados com sucesso na planilha do Forms!", "success");
      } catch (err) {
        showStatus("Falha de rede ao enviar os dados. Verifique sua conexão.", "error");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Enviar Registro";
      }
    });
  </script>
</body>
</html>
